[[mods]]
modId="copyl"
version="3.1.0"
displayName="CopyL"
authors="Santi-PdR"
displayURL="https://github.com/Santi-PdR/Lclient"
description='''
CopyL es un mod 100% client-side para Forge 1.20.1 dedicado exclusivamente a mensajes y comandos rápidos.

Incluye 10 slots configurables con nombre, texto/comando y tecla propia. La tecla global para abrir el editor y las teclas de cada slot se gestionan dentro de CopyL y no aparecen en Opciones > Controles.

CopyL 3.1 elimina por completo el antiguo sistema de variables: el contenido se envía exactamente como fue escrito. El editor y la pantalla de configuración fueron rediseñados con una interfaz más limpia, responsive y visualmente consistente.

La configuración usa guardado atómico y recuperación de JSON corruptos. CopyL no incluye Loot ESP, Smart Offhand, Recon, HUD táctico, Notification Center ni integración con JourneyMap.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.copyl]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.copyl]]
modId="minecraft"
