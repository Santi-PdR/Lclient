plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '2.6.0'
group = 'com.santipdr.lclient'

base {
    archivesName = 'lclient'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                lclient {
                    source sourceSets.main
                }
            }
        }

        client {}
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Curse Maven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    // Compile against the JourneyMap generation used by the Jobs pack.
    // JourneyMap 1.20.1-5.10.3 exposes API 1.20-1.9-SNAPSHOT.
    compileOnly fg.deobf('curse.maven:journeymap-32274:5789363')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'Lclient',
                'Specification-Vendor'    : 'Santi-PdR',
                'Specification-Version'   : '2',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Santi-PdR'
        ])
    }
}
