plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '3.9.3'
group = 'com.santipdr.copyl'

base {
    archivesName = 'copyl'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                copyl {
                    source sourceSets.main
                }
            }
        }

        client {}
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'CopyL',
                'Specification-Vendor'    : 'Santi-PdR',
                'Specification-Version'   : '3',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Santi-PdR'
        ])
    }
}


tasks.register('verifyCopyLLocalization') {
    group = 'verification'
    description = 'Checks English and Spanish regional translations before packaging.'
    doLast {
        def required = [
            'en_us', 'en_au', 'en_ca', 'en_gb', 'en_nz',
            'es_es', 'es_mx', 'es_ar', 'es_419', 'es_bo', 'es_cl', 'es_co', 'es_cr', 'es_do',
            'es_ec', 'es_gt', 'es_hn', 'es_ni', 'es_pa', 'es_pe', 'es_pr', 'es_py', 'es_sv', 'es_uy', 'es_ve'
        ] as Set
        def langDir = file('src/main/resources/assets/copyl/lang')
        def files = fileTree(langDir) { include '*.json' }.files
        def available = files.collect { it.name.replaceFirst(/\.json$/, '') } as Set
        def problems = []
        def packMetadata = parser.parse(new File('src/main/resources/pack.mcmeta'))
        def declaredLanguages = (packMetadata.language ?: [:]).keySet() as Set
        def requiredCustomLanguages = ['es_419', 'es_bo', 'es_co', 'es_cr', 'es_do', 'es_gt', 'es_hn', 'es_ni', 'es_pa', 'es_pe', 'es_pr', 'es_py', 'es_sv'] as Set
        def missingLanguageMetadata = requiredCustomLanguages - declaredLanguages
        if (!missingLanguageMetadata.isEmpty()) {
            problems << 'pack.mcmeta: missing selectable language metadata ' + missingLanguageMetadata.sort().join(', ')
        }
        if (available != required) {
            problems << "expected exactly the supported English/Spanish locales; found ${available.sort()}"
        }

        def parser = new groovy.json.JsonSlurper()
        def baselineFile = new File(langDir, 'en_us.json')
        if (!baselineFile.isFile()) {
            problems << 'missing en_us.json baseline'
        } else {
            def baseline = parser.parse(baselineFile) as Map
            required.each { locale ->
                def localeFile = new File(langDir, "${locale}.json")
                if (!localeFile.isFile()) {
                    problems << "${locale}: missing translation file"
                } else {
                    def translations = parser.parse(localeFile) as Map
                    if (translations.keySet() != baseline.keySet()) {
                        def missing = baseline.keySet() - translations.keySet()
                        def extra = translations.keySet() - baseline.keySet()
                        problems << "${locale}: missing=${missing.sort()} extra=${extra.sort()}"
                    }
                    def blank = translations.findAll { key, value ->
                        !(value instanceof String) || value.trim().isEmpty()
                    }.keySet()
                    if (!blank.isEmpty()) problems << "${locale}: blank values ${blank.sort()}"
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("CopyL localization check failed:\n" + problems.join('\n'))
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyCopyLLocalization')
}
