[[mods]]
modId="lclient"
version="2.6.0"
displayName="Lclient"
authors="Santi-PdR"
displayURL="https://github.com/Santi-PdR/Lclient"
description='''
Cliente modular 100% client-side para Forge 1.20.1.

Lclient 2.6 endurece los cinco módulos actuales —CopyL, Loot ESP, Smart Offhand, Advanced Recon y JourneyMap+— contra cambios de mundo, configuraciones antiguas, inputs mantenidos, GUI Scale alto y comportamientos defectuosos de otros mods.

JourneyMap+ usa JourneyMap 1.20.1-5.10.x / API 1.9 como integración opcional. Sigue MAPPING_STARTED/MAPPING_STOPPED/DISPLAY_UPDATE, reconstruye el waypoint transitorio de Recon cuando JourneyMap refresca displays y nunca conserva objetos Waypoint de una sesión anterior.

Loot ESP conserva su render x-ray con NO_DEPTH_TEST para ItemEntity ya cargados por el cliente. Libera toda referencia al ClientLevel al desactivarse/salir y limita lotes extremos de drops para proteger FPS sin consultar información adicional del servidor.

Smart Offhand usa propiedades de comida del ItemStack, admite AUTO o una comida exacta, evita alimentos perjudiciales en AUTO, restaura la offhand sólo cuando el slot original coincide exactamente y aísla hooks de alimentos modded defectuosos.

CopyL mantiene 10 slots con nombres, variables dinámicas y edición transaccional. Repara/migra configs antiguas, elimina conflictos de teclas, sanea texto externo y evita activaciones fantasma al cerrar menús o reasignar teclas.

Advanced Recon conserva zoom render-only, rueda de magnificación, raycast largo, waypoint donde realmente se mira y Target Panel sólo durante zoom. Su raycast se cachea brevemente para rendimiento, fuerza una lectura fresca al marcar y tolera entidades/bloques modded con hooks rotos. El zoom nunca amplía el FOV respecto al FOV real del jugador.

Las interfaces de Lclient son adaptativas y la configuración no añade controles propios a Opciones > Controles. La tecla global se cambia desde Mods > Lclient > Config; las teclas internas se administran desde la ruleta.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.lclient]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.lclient]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.20.2)"
ordering="NONE"
side="CLIENT"

[[dependencies.lclient]]
modId="journeymap"
mandatory=false
versionRange="[5.10,)"
ordering="AFTER"
side="CLIENT"
