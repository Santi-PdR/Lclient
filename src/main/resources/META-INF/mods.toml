[[mods]]
modId="lclient"
version="2.7.0"
displayName="Lclient"
authors="Santi-PdR"
displayURL="https://github.com/Santi-PdR/Lclient"
description='''
Cliente modular 100% client-side para Forge 1.20.1.

Lclient 2.7 añade una capa de información central sin ensuciar el chat: Notification Center con historial de sesión, duración/cantidad configurable y alertas críticas opcionales para vida baja, inventario lleno y durabilidad de herramienta/armadura.

Loot ESP conserva cajas y beacon x-ray para ItemEntity ya cargados por el cliente, pero añade una lista HUD opcional que agrupa los drops más cercanos por item con cantidad y distancia reutilizando la misma caché de escaneo.

Advanced Recon amplía su Target Panel con equipo visible: item de mano/offhand y cantidad de piezas de armadura, además de nombre, tipo, distancia, coordenadas y vida cuando están disponibles. Mantiene raycast largo, zoom render-only y JourneyMap+ opcional.

CopyL mantiene 10 slots transaccionales y suma variables de objetivo: {target}, {targetdist}, {targetpos}, {targetx}, {targety} y {targetz}. Con Recon activo usa el objetivo del raycast largo; fuera de Recon usa el hitResult vanilla. El editor tiene un layout ultracompacto de dos líneas y paginación dinámica para ventanas estrechas.

Smart Offhand mantiene restauración exacta y selección AUTO/manual, y ahora informa mediante Notification Center cuándo equipa/restaura comida o cuándo abandona una restauración porque el slot original cambió.

Las interfaces siguen siendo adaptativas. La tecla global se cambia desde Mods > Lclient > Config; las teclas internas y ajustes de módulo viven en la ruleta. JourneyMap sigue siendo opcional/compileOnly.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.lclient]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.lclient]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.20.2)"
ordering="NONE"
side="CLIENT"

[[dependencies.lclient]]
modId="journeymap"
mandatory=false
versionRange="[5.10,)"
ordering="AFTER"
side="CLIENT"
