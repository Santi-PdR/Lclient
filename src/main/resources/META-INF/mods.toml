[[mods]]
modId="copyl"
version="1.1.0"
displayName="CopyL"
authors="Santi-PdR"
displayURL="https://github.com/Santi-PdR/CopyL"
description='''
CopyL es un mod 100% client-side de mensajes rápidos para Minecraft.

Guarda hasta 10 mensajes o comandos y asigna una tecla independiente a cada espacio desde Opciones > Controles > CopyL. Al pulsar el atajo, CopyL envía el contenido automáticamente al chat. Si el texto empieza con /, se envía como comando.

Pulsa - por defecto para abrir el editor, o abre Mods > CopyL > Config. Los mensajes se guardan localmente y el servidor no necesita tener CopyL instalado.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.copyl]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

