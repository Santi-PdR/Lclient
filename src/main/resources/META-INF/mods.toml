[[mods]]
modId="copyl"
version="3.0.0"
displayName="CopyL"
authors="Santi-PdR"
displayURL="https://github.com/Santi-PdR/Lclient"
description='''
CopyL es un mod 100% client-side para Forge 1.20.1 dedicado exclusivamente a mensajes y comandos rápidos.

Incluye 10 slots configurables con nombre, mensaje/comando y tecla propia. La tecla global para abrir el editor y las teclas de cada slot se gestionan dentro de CopyL y no aparecen en Opciones > Controles.

Los mensajes admiten variables del jugador y del objetivo actual de la mira vanilla, incluyendo coordenadas, dimensión, vida, hambre, orientación, tipo de objetivo, distancia, HP conocido, velocidad, desnivel, rumbo, movimiento e item visible.

CopyL conserva configuración resistente a fallos, guardado atómico y recuperación de JSON corruptos. No incluye Loot ESP, Smart Offhand, Recon, HUD táctico, Notification Center ni integración con JourneyMap.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.copyl]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.copyl]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.20.2)"
ordering="NONE"
side="CLIENT"
