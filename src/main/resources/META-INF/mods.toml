[[mods]]
modId="lclient"
version="2.5.0"
displayName="Lclient"
authors="Santi-PdR"
displayURL="https://github.com/Santi-PdR/Lclient"
description='''
Cliente modular 100% client-side para Forge 1.20.1.

Lclient 2.5 se centra en estabilidad, recuperación y compatibilidad manteniendo cinco módulos en una única ruleta: CopyL, Loot ESP, Smart Offhand, Advanced Recon y JourneyMap+ opcional.

JourneyMap+ está preparado para JourneyMap 1.20.1-5.10.x / API 1.9. La integración sigue el ciclo real MAPPING_STARTED/MAPPING_STOPPED, no conserva waypoints de sesiones anteriores, reemplaza el waypoint Recon mediante un display ID estable y muestra diagnósticos reales cuando la API no está disponible.

Loot ESP mantiene su render x-ray con NO_DEPTH_TEST para ItemEntity ya cargados por el cliente, pero ahora limita la frecuencia de búsqueda de entidades para reducir coste en zonas con mucho loot.

Smart Offhand conserva la elección AUTO o una comida concreta y mejora la recuperación del objeto anterior al desconectarse. El selector de comida mantiene página y feedback al cambiar opciones.

CopyL usa edición transaccional: Guardar aplica todos los cambios y Cancelar realmente los descarta. Las configuraciones de Lclient/CopyL se escriben de forma atómica y una configuración dañada se respalda automáticamente antes de regenerar valores válidos.

Advanced Recon conserva zoom render-only, rueda para magnificación, raycast largo y Target Panel sólo durante zoom. Los cambios rápidos de zoom se guardan con debounce para evitar escrituras de disco por cada paso de la rueda.

Lclient no añade controles propios a Opciones > Controles. La tecla global se configura desde Mods > Lclient > Config; los módulos y sus teclas se administran desde la ruleta.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.lclient]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.lclient]]
