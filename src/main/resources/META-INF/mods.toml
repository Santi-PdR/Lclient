[[mods]]
modId="lclient"
version="2.4.0"
displayName="Lclient"
authors="Santi-PdR"
displayURL="https://github.com/Santi-PdR/Lclient"
description='''
Cliente modular 100% client-side para Forge 1.20.1.

Lclient 2.4 concentra cinco módulos dentro de una única ruleta: CopyL, Loot ESP, Smart Offhand, Advanced Recon y JourneyMap+ opcional.

Loot ESP usa un render x-ray propio sin depth-test para ItemEntity ya cargados por el cliente. Puede mostrar un marcador vertical, filtrar por alcance/stack y activarse o desactivarse instantáneamente con una tecla configurable (X por defecto).

Smart Offhand permite elegir AUTO o una comida concreta, incluso modded por registry ID. Si la comida elegida no está disponible puede mantenerse en modo estricto o usar fallback AUTO. Conserva la restauración segura del objeto previo de la offhand.

CopyL ofrece 10 slots con nombre, teclas exclusivas y variables dinámicas como {pos}, {x}, {y}, {z}, {dim}, {hp}, {food} y {name}. Lclient protege sus atajos internos para evitar dobles acciones accidentales.

Advanced Recon mantiene su zoom render-only con rueda, raycast client-side largo y Target Panel sólo durante el zoom. Los waypoints de JourneyMap ahora reciben el nombre real del objetivo o bloque apuntado.

Lclient no añade controles propios a Opciones > Controles. La tecla global se configura desde Mods > Lclient > Config; los módulos y sus teclas se administran desde la ruleta.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.lclient]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.lclient]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.20.2)"
ordering="NONE"
side="CLIENT"

[[dependencies.lclient]]
modId="journeymap"
mandatory=false
versionRange="[5.10,)"
ordering="AFTER"
side="CLIENT"
