[[mods]]
modId="lclient"
version="2.3.0"
displayName="Lclient"
authors="Santi-PdR"
displayURL="https://github.com/Santi-PdR/Lclient"
description='''
Cliente modular 100% client-side para Forge 1.20.1.

Lclient 2.3 se concentra en cinco módulos útiles dentro de una sola ruleta: CopyL / mensajes rápidos, Loot ESP propio, Smart Offhand, Advanced Recon y JourneyMap+ opcional.

Advanced Recon usa un zoom render-only que no modifica el FOV guardado de Minecraft. Manteniendo su tecla, la rueda del mouse aumenta o reduce el zoom; el waypoint usa un raycast client-side de largo alcance hacia el punto real bajo la mira. El Target Panel sólo existe durante el zoom.

Loot ESP ya no depende del glow vanilla: renderiza cajas propias sin depth-test alrededor de ItemEntity cercanos. JourneyMap+ está orientado a JourneyMap 1.20.1-5.10.x / API 1.9 y permanece completamente opcional.

Lclient no añade controles propios a Opciones > Controles. La tecla de la ruleta se configura desde Mods > Lclient > Config, y las teclas/ajustes de cada módulo se administran desde la propia ruleta.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.lclient]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.lclient]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.20.2)"
ordering="NONE"
side="CLIENT"

[[dependencies.lclient]]
modId="journeymap"
mandatory=false
versionRange="[5.10,)"
ordering="AFTER"
side="CLIENT"
