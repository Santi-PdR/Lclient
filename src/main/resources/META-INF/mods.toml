[[mods]]
modId="copyl"
version="3.9.4"
displayName="CEDA Dispatch"
authors="Santi-PdR"
displayURL="https://github.com/Santi-PdR/Lclient"
description='''
CEDA Dispatch is a client-side quick-message mod for Minecraft Forge 1.20.1. Save up to ten messages or commands and send them with keyboard or mouse shortcuts.

The interface is available in English and Spanish, including Minecraft's regional variants. Its field-paper panels use static details and clear, unshadowed text. It adds no animation or rendering work to active gameplay.

Español: CEDA Dispatch es un mod de mensajes rápidos para Minecraft Forge 1.20.1. Guarda hasta diez mensajes o comandos y envíalos con atajos de teclado o mouse.

La interfaz está disponible en inglés y español, incluidas las variantes regionales de Minecraft. Sus paneles de papel mantienen detalles estáticos y texto claro, sin animaciones ni trabajo de renderizado durante la partida.
'''
displayTest="IGNORE_SERVER_VERSION"

