[[mods]]
modId="copyl"
version="1.2.0"
displayName="CopyL"
authors="Santi-PdR"
displayURL="https://github.com/Santi-PdR/CopyL"
description='''
CopyL es un mod 100% client-side de mensajes rápidos para Minecraft.

Guarda hasta 10 mensajes o comandos y asigna una tecla independiente a cada uno. Puedes cambiar tanto el texto como la tecla directamente desde el editor de CopyL; también siguen disponibles los controles vanilla en Opciones > Controles > CopyL.

La interfaz incluye animaciones suaves y feedback sonoro para hacer más clara la edición. Al pulsar un atajo, CopyL envía el contenido automáticamente al chat. Si el texto empieza con /, se envía como comando.

Pulsa - por defecto para abrir el editor, o abre Mods > CopyL > Config. Los mensajes y keybinds se guardan localmente y el servidor no necesita tener CopyL instalado.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.copyl]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.copyl]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.20.2)"
ordering="NONE"
side="CLIENT"
