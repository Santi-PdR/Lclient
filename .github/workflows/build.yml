name: Build

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: copyl-build-${{ github.workflow }}-${{ github.ref }}
  # Keep one build per ref at a time, but never let a delayed event from an older
  # commit cancel the build for the current HEAD. Stale runs are already prevented
  # from publishing by the REMOTE_MAIN/GITHUB_SHA check below.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Select and validate mod jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version = ' build.gradle | sed -E "s/version = ['\"]([^'\"]+)['\"]/\1/")"
          JAR="build/libs/copyl-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "Expected final mod JAR was not produced: $JAR" >&2
            echo "Available files:" >&2
            find build/libs -maxdepth 1 -type f -printf '  %f\n' >&2 || true
            exit 1
          fi

          unzip -t "$JAR" >/dev/null
          unzip -Z1 "$JAR" > /tmp/copyl-entries.txt
          grep -Fxq 'META-INF/mods.toml' /tmp/copyl-entries.txt
          grep -Fxq 'com/santipdr/copyl/CopyL.class' /tmp/copyl-entries.txt

          cp "$JAR" /tmp/copyl-latest.jar
          SHA256="$(sha256sum /tmp/copyl-latest.jar | awk '{print $1}')"
          test -n "$SHA256"

          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: CopyL-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.jar_path }}
          if-no-files-found: error

      - name: Publish latest installer payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.jar.outputs.version }}"
          SHA256="${{ steps.jar.outputs.sha256 }}"

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$REMOTE_MAIN" != "$GITHUB_SHA" ]; then
            echo "Skipping installer publication: this run is stale."
            echo "Run SHA:      $GITHUB_SHA"
            echo "Current main: $REMOTE_MAIN"
            exit 0
          fi

          ACTUAL_SHA="$(sha256sum /tmp/copyl-latest.jar | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$SHA256" ]; then
            echo "Installer JAR changed after validation." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin build-output >/dev/null 2>&1; then
            git fetch origin build-output:build-output
            git checkout build-output
          else
            git checkout --orphan build-output
            git rm -rf . || true
          fi

          base64 -w 0 /tmp/copyl-latest.jar > copyl-latest.jar.b64
          printf '\n' >> copyl-latest.jar.b64
          rm -f lclient-latest.jar.b64
          printf '%s\n' "$VERSION" > version.txt
          printf '%s\n' "$SHA256" > sha256.txt
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt

          # build-output only contains installer metadata/payload files, so stage the
          # complete branch state. This also records deletion of any legacy payload
          # without failing when that legacy file is already absent.
          git add -A
          if git diff --cached --quiet; then
            echo "Installer payload already matches this build."
            exit 0
          fi

          git commit -m "build: publish CopyL ${VERSION} [skip ci]"
          git push origin build-output
